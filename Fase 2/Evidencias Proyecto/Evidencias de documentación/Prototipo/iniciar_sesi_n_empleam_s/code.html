<body class="min-h-screen flex items-center justify-center pattern-bg p-margin-mobile md:p-gutter">
<!-- Suppressed navigation shell due to "Linear/Transactional: Login" intent -->
<main class="w-full max-w-[480px]">
<div class="bg-surface-container-lowest rounded-[16px] shadow-level-1 p-[24px] md:p-[48px] flex flex-col gap-stack-md transition-shadow hover:shadow-level-2">
<header class="flex flex-col items-center gap-stack-sm text-center">
<img alt="Empleamás Logo" class="h-16 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCnGtq2J66fUv7UiOqnkGegBT0qEId_w0SFQV8u5wNxH01TkClefFaQs-meSpg2ZtEGA34oW4NJA3u9ccQ7Aw03mtTRswWInJghFdvo2M0rqOFL6S6KqxDszYLTMEBUohtfDrzbhviOYUyIMzwT-NaceI7oztbUrmWBAjhyNcSbONCkEocagkLWCoubNpNKhXLidZN3m6lQtTxkHHm8ez6tugvkQMcZrE4ZKTlY7dFBBqgjmua3mBW8wn8hZywf--BYxqw">
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">Bienvenido a Empleamás</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Accede a tu panel de gestión laboral.</p>
</div>
</header>
<form action="#" class="flex flex-col gap-stack-sm" method="POST">
<div class="flex flex-col gap-[8px]">
<label class="font-label-md text-label-md text-on-surface" for="email">Correo Electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-brand-subtle-highlight border border-brand-subtle-highlight rounded-lg focus:border-brand-bright-blue focus:ring-1 focus:ring-brand-bright-blue focus:outline-none transition-colors font-body-md text-body-md text-on-surface" id="email" name="email" placeholder="tu@correo.com" required="" type="email">
</div>
</div>
<div class="flex flex-col gap-[8px]">
<label class="font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-brand-subtle-highlight border border-brand-subtle-highlight rounded-lg focus:border-brand-bright-blue focus:ring-1 focus:ring-brand-bright-blue focus:outline-none transition-colors font-body-md text-body-md text-on-surface" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<div class="flex items-center justify-between mt-2">
<label class="flex items-center gap-2 cursor-pointer">
<input class="rounded border-outline-variant text-brand-bright-blue focus:ring-brand-bright-blue w-4 h-4 bg-surface-container-lowest" type="checkbox">
<span class="font-caption text-caption text-on-surface-variant">Mantener sesión iniciada</span>
</label>
<a class="font-caption text-caption text-primary hover:text-brand-bright-blue transition-colors font-semibold" href="#">
                        ¿Olvidaste tu contraseña?
                    </a>
</div>
<button class="mt-4 w-full bg-brand-bright-blue text-on-primary py-3 px-6 rounded-lg font-label-md text-label-md flex justify-center items-center gap-2 hover:opacity-90 transition-opacity" type="submit">
                    Iniciar Sesión
                    <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">login</span>
</button>
</form>
<div class="text-center mt-2 border-t border-brand-subtle-highlight pt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                    ¿No tienes cuenta? 
                    <a class="text-primary font-semibold hover:text-brand-bright-blue transition-colors ml-1" href="#">Regístrate</a>
</p>
</div>
</div>
